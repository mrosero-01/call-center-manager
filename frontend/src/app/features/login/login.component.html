<main class="login-page">
  <section class="brand-pane" aria-label="Siptic">
    <div class="brand-copy">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>Siptic</strong>
          <small>Ingeniería y servicios IP</small>
        </div>
      </div>

      <h1>Administra call centers.</h1>
      <span>Cambios trazables y sincronización segura con Asterisk.</span>
    </div>

    <figure class="brand-visual">
      <img src="assets/siptic/voz.webp" alt="" />
      <figcaption>
        <strong>Operación clara</strong>
        <span>Horarios por cliente, franjas mañana/tarde y auditoría de cambios.</span>
      </figcaption>
    </figure>
  </section>

  <section class="login-pane">
    <div class="login-box">
      <div class="login-title">
        <span class="mark">
          <svg lucideShieldCheck [size]="22" aria-hidden="true"></svg>
        </span>
        <div>
          <p>Panel seguro</p>
          <h1>Iniciar sesión</h1>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <p class="form-intro">Usa tu cuenta asignada para acceder a la configuración permitida.</p>

        <label>
          <span>Usuario</span>
          <input
            type="text"
            formControlName="username"
            autocomplete="username"
            [attr.aria-invalid]="shouldShowFieldError('username')"
            aria-describedby="username-error"
          />
          @if (shouldShowFieldError('username')) {
            <small id="username-error" class="field-error">{{ fieldError('username') }}</small>
          }
        </label>

        <label>
          <span>Contraseña</span>
          <span class="password-control">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              [attr.aria-invalid]="shouldShowFieldError('password')"
              aria-describedby="password-error"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
              [attr.title]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
            >
              @if (showPassword()) {
                <svg lucideEyeOff [size]="18" aria-hidden="true"></svg>
              } @else {
                <svg lucideEye [size]="18" aria-hidden="true"></svg>
              }
            </button>
          </span>
          @if (shouldShowFieldError('password')) {
            <small id="password-error" class="field-error">{{ fieldError('password') }}</small>
          }
        </label>

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="submit-button" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner" aria-hidden="true"></span>
          } @else {
            <svg lucideLogIn [size]="18" aria-hidden="true"></svg>
          }
          <span>{{ loading() ? 'Ingresando' : 'Ingresar' }}</span>
        </button>
      </form>
    </div>
  </section>
</main>
