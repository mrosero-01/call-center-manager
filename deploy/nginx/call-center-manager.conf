server {
    listen 80;
    server_name panel.tudominio.com;

    # En produccion real, redirigir a HTTPS con Certbot o configurar listen 443 ssl.
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    root /home/miguel/Siptic-p/call-center-manager/frontend/dist/siptic-call-center-manager/browser;
    index index.html;

    location /static/ {
        alias /home/miguel/Siptic-p/call-center-manager/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
